<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brew Buddy Cafe | Admin Inventory</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    html,
    body {
      min-height: 100%;
      background: #24160e;
      color: #302219;
      overflow-x: hidden;
    }

    /* Animated Coffee Background */
    .bg-layer {
      position: fixed;
      inset: -20px;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-layer img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      filter: brightness(54%) contrast(1.06) saturate(1.08);
      transform: scale(1.08);
      animation: slowKenBurns 24s ease-in-out infinite alternate;
    }

    @keyframes slowKenBurns {
      0% { transform: scale(1.06) translate3d(0, 0, 0); }
      100% { transform: scale(1.14) translate3d(-1.5%, -1%, 0); }
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        circle at center,
        rgba(24, 14, 8, 0.35) 0%,
        rgba(14, 7, 3, 0.85) 100%
      );
    }

    .beans {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .bean {
      position: absolute;
      top: -50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9a6946, #3b2215);
      box-shadow: inset 0 1px 2px rgba(255, 225, 190, 0.25);
      opacity: 0;
      will-change: transform, opacity;
    }

    .bean::after {
      content: "";
      position: absolute;
      width: 20%;
      height: 70%;
      top: 15%;
      left: 40%;
      border-radius: 50%;
      background: #c59b74;
      transform: rotate(10deg);
    }

    /* Top Navigation */
    .top-bar {
      position: fixed;
      top: 18px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: #fff6ec;
      background: rgba(42, 26, 16, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 235, 210, 0.28);
      padding: 6px 16px 6px 8px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      transition: 0.22s ease;
    }

    .brand-pill:hover {
      background: rgba(65, 41, 26, 0.9);
      transform: translateY(-1px);
    }

    .brand-pill img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-pill {
      text-decoration: none;
      color: #fff6ec;
      background: rgba(42, 26, 16, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 235, 210, 0.28);
      font-size: 12px;
      font-weight: bold;
      padding: 9px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.22s ease;
    }

    .nav-pill:hover {
      background: #f6efe7;
      color: #38251b;
      transform: translateY(-1px);
    }

    .page-wrapper {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 84px 18px 36px;
    }

    /* Eye-Catchy Admin Login Card */
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 252, 248, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid #eadfd3;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 28px 65px rgba(10, 5, 2, 0.65);
      animation: cardAppear 0.55s ease;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-banner {
      background: linear-gradient(135deg, #563923 0%, #2b1a10 100%);
      padding: 28px 24px 24px;
      text-align: center;
      color: #fff8f0;
      border-bottom: 1px solid rgba(255, 224, 178, 0.2);
    }

    .login-logo-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 10px;
      border-radius: 20px;
      background: rgba(255, 246, 234, 0.14);
      border: 1px solid rgba(255, 224, 178, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }

    .login-logo-box img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }

    .login-eyebrow {
      display: inline-block;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: #ffcf66;
      margin-bottom: 6px;
    }

    .login-banner h1 {
      font-size: 25px;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .login-banner p {
      font-size: 13px;
      color: #e8d8c7;
      line-height: 1.5;
    }

    .login-body {
      padding: 26px 26px 28px;
    }

    .field-group {
      margin-bottom: 15px;
    }

    .field-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #39271d;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border-radius: 11px;
      border: 1px solid #d8c6b4;
      background: #fffdf9;
      color: #302219;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-wrap input:focus {
      outline: none;
      border-color: #6b4423;
      box-shadow: 0 0 0 3px rgba(107, 68, 35, 0.16);
    }

    .toggle-pw-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: #765237;
      font-size: 11.5px;
      font-weight: bold;
      padding: 4px 6px;
      cursor: pointer;
    }

    .toggle-pw-btn:hover {
      color: #2b1a10;
    }

    .login-submit-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 11px;
      border: none;
      background: linear-gradient(135deg, #6b4423 0%, #3d2514 100%);
      color: #fff8f0;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(43, 26, 16, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .login-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(43, 26, 16, 0.36);
      filter: brightness(1.06);
    }

    .login-submit-btn:active {
      transform: translateY(0);
    }

    #authMsg {
      margin-top: 12px;
      min-height: 18px;
      font-size: 12.5px;
      font-weight: bold;
      color: #b3261e;
      text-align: center;
    }

    .login-footer-note {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #ece1d5;
      text-align: center;
      font-size: 11.5px;
      color: #847366;
    }

    /* Inventory Dashboard Container */
    .container {
      width: 100%;
      max-width: 1050px;
      background: rgba(255, 253, 249, 0.97);
      backdrop-filter: blur(12px);
      border: 1px solid #eadfd3;
      padding: 28px;
      border-radius: 22px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.5);
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid #eadfd3;
      gap: 12px;
      flex-wrap: wrap;
    }

    .dash-header h1 {
      color: #39271d;
      font-size: 25px;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    input,
    select,
    button {
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid #d8c6b4;
      font-size: 14px;
    }

    button {
      background: #563923;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s ease;
    }

    button:hover {
      background: #38251b;
    }

    .btn-danger {
      background: #b3261e;
    }

    .btn-danger:hover {
      background: #8c1c15;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eadfd3;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f3ece3;
      color: #39271d;
    }

    .badge-low {
      background: #fde8e8;
      color: #b3261e;
      padding: 4px 9px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 12px;
    }

    .badge-ok {
      background: #e6f4ea;
      color: #1e7e34;
      padding: 4px 9px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .top-bar {
        left: 12px;
        right: 12px;
        top: 12px;
      }

      .page-wrapper {
        padding-top: 96px;
      }

      .login-body,
      .container {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer">
    <img src="img1.jpg" alt="Brew Buddy Cafe Background">
  </div>
  <div class="bg-overlay"></div>
  <div class="beans" id="beansContainer"></div>

  <header class="top-bar">
    <a href="home.html" class="brand-pill">
      <img src="logo1-removebg-preview.png" alt="Brew Buddy Cafe Logo">
      <span>Brew Buddy Cafe</span>
    </a>

    <div class="top-actions">
      <a href="home.html" class="nav-pill">Home</a>
      <button id="logoutBtn" class="nav-pill" style="display:none; background:#765237;" onclick="logoutAdmin()">Log Out</button>
    </div>
  </header>

  <main class="page-wrapper">
    <!-- Eye-Catchy Admin Login Card -->
    <section id="loginBox" class="login-card" aria-label="Admin Sign In">
      <div class="login-banner">
        <div class="login-logo-box">
          <img src="logo1-removebg-preview.png" alt="Brew Buddy Emblem">
        </div>
        <span class="login-eyebrow">Staff &amp; Barista Portal</span>
        <h1>Admin Inventory Login</h1>
      </div>

      <div class="login-body">
        <div class="field-group">
          <label for="adminEmail">Admin Email</label>
          <div class="input-wrap">
            <input type="email" id="adminEmail" placeholder="admin@brewbuddy.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field-group">
          <label for="adminPassword">Password</label>
          <div class="input-wrap">
            <input type="password" id="adminPassword" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="toggle-pw-btn" id="togglePwBtn" onclick="togglePassword()">Show</button>
          </div>
        </div>

        <button type="button" class="login-submit-btn" id="loginSubmitBtn" onclick="loginAdmin()">
          ☕ Log In to Dashboard
        </button>

        <p id="authMsg"></p>

        <div class="login-footer-note">
          Brew Buddy Cafe • Sip Good, Feel Good
        </div>
      </div>
    </section>

    <!-- Inventory Dashboard (Hidden until logged in) -->
    <section id="inventoryApp" class="container" style="display:none;" aria-label="Inventory Management">
      <div class="dash-header">
        <h1>☕ Admin Inventory Management</h1>
        <span style="font-size:12.5px; color:#7d6c5f; font-weight:bold;">Live Supabase Stock Control</span>
      </div>

      <h3 style="margin-bottom: 10px; color: #39271d;">Add New Product to Inventory</h3>
      <form id="addProductForm" class="grid-form">
        <input type="text" id="prodName" placeholder="Product Name (e.g. Cafe Latte)" required />
        <select id="prodCategory" required>
          <option value="Coffee">Coffee</option>
          <option value="Frappe">Frappe</option>
          <option value="Tea">Tea</option>
          <option value="Waffles">Waffles</option>
          <option value="Pastries">Pastries</option>
          <option value="Sandwich">Sandwich</option>
          <option value="Desserts">Desserts</option>
        </select>
        <input type="number" id="prodPrice" placeholder="Price (₱)" step="0.01" required />
        <input type="number" id="prodStock" placeholder="Initial Stock" min="0" required />
        <input type="text" id="prodImage" placeholder="Image filename (e.g. cafe latte.png)" />
        <button type="submit">+ Add Item</button>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://owtnvtvnkoidnctugpnw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_DyMeJn5BJx012b_2ailLfw_hYmxr_sX";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function togglePassword() {
      const pwInput = document.getElementById("adminPassword");
      const btn = document.getElementById("togglePwBtn");
      if (!pwInput || !btn) return;
      const isHidden = pwInput.type === "password";
      pwInput.type = isHidden ? "text" : "password";
      btn.textContent = isHidden ? "Hide" : "Show";
    }

    document.getElementById("adminPassword").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        loginAdmin();
      }
    });

    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("inventoryApp").style.display = "block";
        document.getElementById("logoutBtn").style.display = "inline-block";
        loadInventory();
      }
    }

    async function loginAdmin() {
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;
      const msg = document.getElementById("authMsg");
      const btn = document.getElementById("loginSubmitBtn");
      msg.textContent = "";

      if (!email || !password) {
        msg.textContent = "Pakilagay ang Admin Email at Password.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Signing in...";

      const { error } = await sb.auth.signInWithPassword({ email, password });

      btn.disabled = false;
      btn.textContent = "☕ Log In to Dashboard";

      if (error) {
        msg.textContent = "Login failed: " + error.message;
        return;
      }
      checkSession();
    }

    async function logoutAdmin() {
      await sb.auth.signOut();
      location.reload();
    }

    async function loadInventory() {
      const { data, error } = await sb
        .from("products")
        .select("*")
        .order("id", { ascending: true });

      if (error) {
        alert("Error loading inventory: " + error.message);
        return;
      }

      const tbody = document.getElementById("inventoryBody");
      tbody.innerHTML = (data || []).map(item => {
        const threshold = item.low_stock_threshold ?? 5;
        const isLow = item.stock <= threshold;
        const statusBadge = item.stock === 0
          ? `<span class="badge-low">Out of Stock</span>`
          : isLow
            ? `<span class="badge-low">Low Stock (${item.stock})</span>`
            : `<span class="badge-ok">In Stock (${item.stock})</span>`;

        return `
          <tr>
            <td><strong>${item.name}</strong></td>
            <td>${item.category}</td>
            <td>₱${Number(item.price).toFixed(2)}</td>
            <td>
              <input type="number" id="stock-${item.id}" value="${item.stock}" min="0" style="width:80px;" />
              <button type="button" onclick="updateStock(${item.id})">Save</button>
            </td>
            <td>${statusBadge}</td>
            <td>
              <button type="button" class="btn-danger" onclick="deleteProduct(${item.id})">Delete</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("prodName").value.trim(),
        category: document.getElementById("prodCategory").value,
        price: Number(document.getElementById("prodPrice").value),
        stock: Number(document.getElementById("prodStock").value),
        image: document.getElementById("prodImage").value.trim() || "img1.jpg"
      };

      const { error } = await sb.from("products").insert([payload]);
      if (error) {
        alert("Failed to add item: " + error.message);
        return;
      }
      e.target.reset();
      loadInventory();
    });

    async function updateStock(id) {
      const newStock = Number(document.getElementById(`stock-${id}`).value);
      const { error } = await sb
        .from("products")
        .update({ stock: newStock, is_available: newStock > 0, updated_at: new Date().toISOString() })
        .eq("id", id);

      if (error) {
        alert("Update failed: " + error.message);
        return;
      }
      loadInventory();
    }

    async function deleteProduct(id) {
      if (!confirm("Delete this item from inventory?")) return;
      const { error } = await sb.from("products").delete().eq("id", id);
      if (error) {
        alert("Delete failed: " + error.message);
        return;
      }
      loadInventory();
    }

    (function initBeans() {
      const container = document.getElementById("beansContainer");
      if (!container) return;
      const beanCount = 10;
      const beans = [];

      for (let i = 0; i < beanCount; i++) {
        const el = document.createElement("span");
        el.className = "bean";
        const size = 12 + Math.random() * 8;
        el.style.width = size + "px";
        el.style.height = (size * 1.5) + "px";
        container.appendChild(el);

        beans.push({
          el: el,
          x: Math.random() * 100,
          y: Math.random() * 110 - 10,
          speed: 0.04 + Math.random() * 0.05,
          swayOffset: Math.random() * Math.PI * 2,
          swaySpeed: 0.0015 + Math.random() * 0.0015,
          rot: Math.random() * 360,
          rotSpeed: (Math.random() > 0.5 ? 1 : -1) * (0.3 + Math.random() * 0.5),
          maxOpacity: 0.2 + Math.random() * 0.2
        });
      }

      let lastTime = performance.now();
      function animate(now) {
        const dt = Math.min(now - lastTime, 50);
        lastTime = now;

        for (let j = 0; j < beans.length; j++) {
          const b = beans[j];
          b.y += b.speed * (dt / 16.67);
          b.rot += b.rotSpeed * (dt / 16.67);
          if (b.y > 108) {
            b.y = -8;
            b.x = Math.random() * 100;
          }
          const sway = Math.sin(now * b.swaySpeed + b.swayOffset) * 14;
          const fade = b.y < 10 ? Math.max(0, b.y / 10) : (b.y > 90 ? Math.max(0, (108 - b.y) / 18) : 1);
          const pxX = (b.x / 100) * window.innerWidth + sway;
          const pxY = (b.y / 100) * window.innerHeight;

          b.el.style.opacity = (b.maxOpacity * fade).toFixed(3);
          b.el.style.transform = `translate3d(${pxX.toFixed(1)}px, ${pxY.toFixed(1)}px, 0) rotate(${b.rot.toFixed(1)}deg)`;
        }
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    })();

    checkSession();
  </script>
</body>
</html>
