<!DOCTYPE html>
<html lang="en">

<head>
    <title>Brew Buddy Cafe | Create Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #24160e;
            color: #302219;
            overflow-x: hidden;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            transition: transform 0.25s ease-out;
        }

        .bg-layer img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
            filter: brightness(63%) contrast(1.06) saturate(1.08);
            transform: scale(1.12);
            animation: slowKenBurns 24s ease-in-out infinite alternate;
        }

        @keyframes slowKenBurns {
            0% {
                transform: scale(1.1) translate3d(0, 0, 0);
            }
            100% {
                transform: scale(1.16) translate3d(-1.5%, -1%, 0);
            }
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
                rgba(24, 14, 8, 0.35) 0%,
                rgba(18, 10, 5, 0.78) 100%
            );
        }

        .beans {
            position: fixed;
            inset: 0;
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
        }

        .bean {
            position: absolute;
            top: -50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9a6946, #3b2215);
            box-shadow: inset 0 1px 2px rgba(255, 225, 190, 0.25);
            opacity: 0;
            will-change: transform, opacity;
        }

        .bean::after {
            content: "";
            position: absolute;
            width: 20%;
            height: 70%;
            top: 15%;
            left: 40%;
            border-radius: 50%;
            background: #c59b74;
            transform: rotate(10deg);
        }

        .hero-tagline {
            position: fixed;
            left: 34px;
            bottom: 30px;
            z-index: 2;
            color: #fff;
            max-width: 360px;
            pointer-events: none;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        }

        .hero-tagline .small-text {
            display: inline-block;
            font-size: 10.5px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: #f0cfa9;
            margin-bottom: 6px;
        }

        .hero-tagline h1 {
            font-size: clamp(26px, 2.8vw, 38px);
            line-height: 1.15;
            margin-bottom: 7px;
        }

        .hero-tagline p {
            font-size: 13px;
            line-height: 1.6;
            color: #efe4d8;
        }

        .navigation {
            position: fixed;
            top: 16px;
            right: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .navigation a {
            text-decoration: none;
            color: #fff6ec;
            background: rgba(42, 26, 16, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 235, 210, 0.28);
            font-size: 12px;
            font-weight: bold;
            padding: 9px 15px;
            border-radius: 30px;
            transition: 0.22s ease;
        }

        .navigation a:hover {
            background: #f6efe7;
            color: #38251b;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        }

        .page-wrapper {
            position: relative;
            z-index: 4;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 64px 16px 26px;
        }

        .create-card {
            width: 100%;
            max-width: 430px;
            padding: 24px 30px 22px;
            background: rgba(255, 252, 248, 0.97);
            backdrop-filter: blur(12px);
            border: 1px solid #eadfd3;
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(10, 5, 2, 0.55);
            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .brand-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
            color: #987354;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2.2px;
            text-transform: uppercase;
        }

        .brand-label span {
            width: 20px;
            height: 1px;
            background: #c9a98a;
        }

        .logo {
            text-align: center;
            margin-bottom: 4px;
        }

        .logo img {
            width: 68px;
            height: 68px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(56, 37, 27, 0.14));
        }

        .title {
            color: #39271d;
            font-size: 25px;
            letter-spacing: -0.6px;
            text-align: center;
            margin-bottom: 3px;
        }

        .welcome {
            font-size: 12.5px;
            text-align: center;
            margin-bottom: 16px;
            color: #877567;
        }

        .create-form label {
            display: block;
            color: #493629;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-box {
            display: flex;
            align-items: center;
            width: 100%;
            height: 42px;
            padding: 0 12px;
            margin-bottom: 12px;
            border: 1px solid #dfd3c7;
            border-radius: 9px;
            background: #fff;
            transition: 0.22s ease;
        }

        .input-box:focus-within {
            border-color: #805638;
            box-shadow: 0 0 0 3px rgba(128, 86, 56, 0.14);
        }

        .input-icon {
            color: #a1846a;
            font-size: 14px;
            margin-right: 9px;
            user-select: none;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #39271d;
        }

        .input-box input::placeholder {
            color: #b4a69b;
        }

        .password-box {
            display: flex;
            align-items: center;
            width: 100%;
            height: 42px;
            margin-bottom: 6px;
            border: 1px solid #dfd3c7;
            border-radius: 9px;
            background: #fff;
            overflow: hidden;
            transition: 0.22s ease;
        }

        .password-box.confirm-spacing {
            margin-bottom: 12px;
        }

        .password-box:focus-within {
            border-color: #805638;
            box-shadow: 0 0 0 3px rgba(128, 86, 56, 0.14);
        }

        .password-box input {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0 12px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #39271d;
        }

        .password-box input::placeholder {
            color: #b4a69b;
        }

        .show-btn {
            height: 100%;
            padding: 0 14px;
            border: none;
            border-left: 1px solid #eadfd3;
            background: #f5ede3;
            color: #62452f;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .show-btn:hover {
            background: #e8dac9;
            color: #38251b;
        }

        .strength-meter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .strength-bars {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .strength-bar {
            height: 4px;
            flex: 1;
            border-radius: 999px;
            background: #e6dacd;
            transition: background 0.25s ease;
        }

        .strength-label {
            font-size: 10.5px;
            font-weight: bold;
            color: #8d7c6e;
            white-space: nowrap;
        }

        #message {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            min-height: 16px;
            margin-bottom: 8px;
        }

        .create-btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #6b4423, #4a2d16);
            color: #fff;
            font-size: 12.5px;
            font-weight: bold;
            letter-spacing: 0.9px;
            cursor: pointer;
            transition: 0.22s ease;
        }

        .create-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(56, 37, 27, 0.26);
        }

        .account-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0 11px;
            color: #9e8f82;
            font-size: 11px;
        }

        .account-divider::before,
        .account-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e8ddd1;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 10px 14px;
            text-align: center;
            text-decoration: none;
            background-color: #fff;
            color: #62452f;
            border: 1px solid #bca58f;
            border-radius: 9px;
            font-size: 12px;
            font-weight: bold;
            transition: 0.22s ease;
        }

        .back-btn:hover {
            background-color: #efe5d8;
            border-color: #62452f;
        }

        .card-footer {
            text-align: center;
            margin-top: 14px;
            color: #9e8f82;
            font-size: 10px;
            letter-spacing: 0.7px;
        }

        @media (max-width: 1060px) {
            .hero-tagline {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .navigation {
                top: 12px;
                right: 0;
                left: 0;
                justify-content: center;
            }

            .navigation a {
                padding: 8px 14px;
                font-size: 11.5px;
            }

            .page-wrapper {
                padding: 60px 12px 22px;
            }

            .create-card {
                padding: 20px 18px 18px;
                border-radius: 18px;
            }

            .title {
                font-size: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="bg-layer" id="bgLayer">
        <img src="img1.jpg" alt="Brew Buddy Cafe Background">
    </div>
    <div class="bg-overlay"></div>

    <div class="beans" id="beansContainer"></div>
    <nav class="navigation" aria-label="Primary Navigation">
        <a href="Review.html">Reviews</a>
        <a href="About.html">About Us</a>
    </nav>

    <div class="page-wrapper">
        <div class="create-card">
            <div class="brand-label">
                <span></span>
                JOIN THE CLUB
                <span></span>
            </div>

            <div class="logo">
                <img src="logo1-removebg-preview.png" alt="Brew Buddy Cafe Logo">
            </div>

            <h2 class="title">Create Account</h2>
            <p class="welcome">Join Brew Buddy Cafe for cozy coffee moments.</p>

            <form class="create-form" id="createForm">
                <label for="fullname">Full Name</label>
                <div class="input-box">
                    <span class="input-icon">☕</span>
                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <label for="email">Email Address</label>
                <div class="input-box">
                    <span class="input-icon">✉</span>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <label for="password">Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Create your password (8+ chars)"
                        minlength="8"
                        required
                    >
                    <button
                        type="button"
                        class="show-btn"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>
                </div>

                <div class="strength-meter" aria-hidden="true">
                    <div class="strength-bars">
                        <span class="strength-bar" id="bar1"></span>
                        <span class="strength-bar" id="bar2"></span>
                        <span class="strength-bar" id="bar3"></span>
                    </div>
                    <span class="strength-label" id="strengthLabel">8+ chars</span>
                </div>

                <label for="confirmPassword">Confirm Password</label>
                <div class="password-box confirm-spacing">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                    <button
                        type="button"
                        class="show-btn"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </button>
                </div>

                <p id="message"></p>

                <button type="submit" class="create-btn">
                    CREATE ACCOUNT
                </button>

                <div class="account-divider">
                    ALREADY A MEMBER?
                </div>

                <a href="Login.html" class="back-btn">
                    Back to Login
                </a>
            </form>

            <div class="card-footer">
                MADE WITH CARE AT BREW BUDDY CAFE
            </div>
        </div>
    </div>

    <script>
        function togglePassword(id, button) {
            var password = document.getElementById(id);

            if (password.type === "password") {
                password.type = "text";
                button.innerHTML = "Hide";
            } else {
                password.type = "password";
                button.innerHTML = "Show";
            }
        }

        var passwordInput = document.getElementById("password");
        var confirmInput = document.getElementById("confirmPassword");
        var messageEl = document.getElementById("message");

        function updateStrength(val) {
            var bars = [
                document.getElementById("bar1"),
                document.getElementById("bar2"),
                document.getElementById("bar3")
            ];
            var label = document.getElementById("strengthLabel");

            bars.forEach(function(b) {
                b.style.background = "#e6dacd";
            });

            if (!val) {
                label.textContent = "8+ chars";
                label.style.color = "#8d7c6e";
                return;
            }

            var score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val) || /[0-9]/.test(val)) score++;
            if (val.length >= 10 && /[^A-Za-z0-9]/.test(val)) score++;
            if (score === 0 && val.length >= 4) score = 1;

            var colors = ["#d64538", "#e5a920", "#2f7d4a"];
            var texts = ["Weak", "Fair", "Strong"];

            for (var i = 0; i < score; i++) {
                bars[i].style.background = colors[Math.min(score - 1, 2)];
            }

            label.textContent = texts[Math.min(Math.max(score - 1, 0), 2)];
            label.style.color = colors[Math.min(Math.max(score - 1, 0), 2)];
        }

        passwordInput.addEventListener("input", function() {
            updateStrength(passwordInput.value);
            if (confirmInput.value && confirmInput.value !== passwordInput.value) {
                messageEl.style.color = "#b3261e";
                messageEl.textContent = "Passwords do not match yet.";
            } else {
                messageEl.textContent = "";
            }
        });

        confirmInput.addEventListener("input", function() {
            if (confirmInput.value && confirmInput.value !== passwordInput.value) {
                messageEl.style.color = "#b3261e";
                messageEl.textContent = "Passwords do not match yet.";
            } else {
                messageEl.textContent = "";
            }
        });

        document.getElementById("createForm").addEventListener("submit", function(event) {
            event.preventDefault();

            var fullname = document.getElementById("fullname").value.trim();
            var email = document.getElementById("email").value.trim().toLowerCase();
            var password = passwordInput.value;
            var confirmPassword = confirmInput.value;
            var message = document.getElementById("message");

            if (password.length < 8) {
                message.style.color = "#b3261e";
                message.innerHTML = "Password must be at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.style.color = "#b3261e";
                message.innerHTML = "Passwords do not match!";
                return;
            }

            var accounts = JSON.parse(localStorage.getItem("accounts")) || [];
            var existingAccount = accounts.find(function(account) {
                return account.email.toLowerCase() === email;
            });

            if (existingAccount) {
                message.style.color = "#b3261e";
                message.innerHTML = "Email is already registered!";
                return;
            }

            var newAccount = {
                fullname: fullname,
                email: email,
                password: password
            };

            accounts.push(newAccount);
            localStorage.setItem("accounts", JSON.stringify(accounts));
            alert("Account created successfully! You can now log in.");
            window.location.href = "Login.html";
        });

        (function initMotion() {
            var prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (prefersReduced) return;

            var beansContainer = document.getElementById("beansContainer");
            var bgLayer = document.getElementById("bgLayer");

            var beanCount = 12;
            var beans = [];

            for (var i = 0; i < beanCount; i++) {
                var el = document.createElement("span");
                el.className = "bean";
                var size = 12 + Math.random() * 8;
                el.style.width = size + "px";
                el.style.height = (size * 1.5) + "px";
                beansContainer.appendChild(el);

                beans.push({
                    el: el,
                    x: Math.random() * 100,
                    y: Math.random() * 110 - 10,
                    speed: 0.045 + Math.random() * 0.055,
                    swayOffset: Math.random() * Math.PI * 2,
                    swaySpeed: 0.0015 + Math.random() * 0.0015,
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() > 0.5 ? 1 : -1) * (0.3 + Math.random() * 0.6),
                    maxOpacity: 0.22 + Math.random() * 0.22
                });
            }

            var mouseX = 0;
            var mouseY = 0;
            var currentBgX = 0;
            var currentBgY = 0;

            document.addEventListener("mousemove", function(e) {
                mouseX = (e.clientX / window.innerWidth) - 0.5;
                mouseY = (e.clientY / window.innerHeight) - 0.5;
            });

            document.addEventListener("mouseleave", function() {
                mouseX = 0;
                mouseY = 0;
            });

            var lastTime = performance.now();

            function animate(now) {
                var dt = Math.min(now - lastTime, 50);
                lastTime = now;

                currentBgX += (-mouseX * 16 - currentBgX) * 0.06;
                currentBgY += (-mouseY * 16 - currentBgY) * 0.06;
                if (bgLayer) {
                    bgLayer.style.transform = "translate3d(" + currentBgX.toFixed(2) + "px, " + currentBgY.toFixed(2) + "px, 0)";
                }

                for (var j = 0; j < beans.length; j++) {
                    var b = beans[j];
                    b.y += b.speed * (dt / 16.67);
                    b.rot += b.rotSpeed * (dt / 16.67);

                    if (b.y > 108) {
                        b.y = -8;
                        b.x = Math.random() * 100;
                    }

                    var sway = Math.sin(now * b.swaySpeed + b.swayOffset) * 14;
                    var fade = 1;
                    if (b.y < 10) fade = Math.max(0, b.y / 10);
                    else if (b.y > 90) fade = Math.max(0, (108 - b.y) / 18);

                    var opacity = (b.maxOpacity * fade).toFixed(3);
                    var pxX = (b.x / 100) * window.innerWidth + sway;
                    var pxY = (b.y / 100) * window.innerHeight;

                    b.el.style.opacity = opacity;
                    b.el.style.transform = "translate3d(" + pxX.toFixed(1) + "px, " + pxY.toFixed(1) + "px, 0) rotate(" + b.rot.toFixed(1) + "deg)";
                }

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        })();
    </script>

</body>

</html>
