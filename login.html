<!DOCTYPE html>
<html lang="en">

<head>
    <title>Brew Buddy Cafe | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #24160e;
            color: #302219;
            overflow-x: hidden;
        }

        .bg-layer {
            position: fixed;
            inset: -24px;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            transition: transform 0.25s ease-out;
        }

        .bg-layer img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
            filter: brightness(68%) contrast(1.04);
            transform: scale(1.04);
            animation: slowKenBurns 24s ease-in-out infinite alternate;
        }

        @keyframes slowKenBurns {
            0% {
                transform: scale(1.03) translate3d(0, 0, 0);
            }
            100% {
                transform: scale(1.1) translate3d(-1.5%, -1%, 0);
            }
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
                rgba(24, 14, 8, 0.34) 0%,
                rgba(24, 14, 8, 0.72) 100%
            );
            transition: background 0.3s ease;
        }

        body.modal-open .bg-overlay {
            background: radial-gradient(
                circle at center,
                rgba(18, 10, 5, 0.45) 0%,
                rgba(18, 10, 5, 0.78) 100%
            );
        }

        .hero-tagline {
            position: fixed;
            left: 36px;
            bottom: 32px;
            z-index: 2;
            color: #fff;
            max-width: 420px;
            pointer-events: none;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        }

        .hero-tagline .small-text {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: #f0cfa9;
            margin-bottom: 8px;
        }

        .hero-tagline h1 {
            font-size: clamp(28px, 3.4vw, 46px);
            line-height: 1.15;
            margin-bottom: 8px;
        }

        .hero-tagline p {
            font-size: 13.5px;
            line-height: 1.65;
            color: #efe4d8;
        }

        .navigation {
            position: fixed;
            top: 20px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .navigation a,
        .nav-login-btn {
            text-decoration: none;
            color: #fff6ec;
            background: rgba(42, 26, 16, 0.6);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 235, 210, 0.25);
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .navigation a:hover,
        .nav-login-btn:hover,
        .nav-login-btn.active {
            background: rgba(243, 236, 227, 0.96);
            color: #38251b;
            transform: translateY(-1px);
        }

        .beans {
            position: fixed;
            inset: 0;
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
        }

        .bean {
            position: absolute;
            top: -50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9a6946, #3b2215);
            box-shadow: inset 0 1px 2px rgba(255, 225, 190, 0.25);
            opacity: 0;
            will-change: transform, opacity;
        }

        .bean::after {
            content: "";
            position: absolute;
            width: 20%;
            height: 70%;
            top: 15%;
            left: 40%;
            border-radius: 50%;
            background: #c59b74;
            transform: rotate(10deg);
        }

        .login-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 75px 20px 30px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.28s ease, visibility 0.28s ease;
        }

        .login-modal-backdrop.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .login-content {
            width: 100%;
            max-width: 410px;
            max-height: calc(100vh - 105px);
            overflow-y: auto;
            padding: 26px 32px;
            position: relative;
            z-index: 9;
            background: rgba(255, 253, 249, 0.96);
            backdrop-filter: blur(10px);
            border: 1px solid #eadfd3;
            border-radius: 20px;
            box-shadow: 0 24px 55px rgba(12, 6, 3, 0.52);
            transform: translateY(22px) scale(0.94);
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
            transform-style: preserve-3d;
        }

        .login-modal-backdrop.is-open .login-content {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .close-login-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 30px;
            height: 30px;
            border: 1px solid #e3d9cf;
            border-radius: 50%;
            background: #f6efe7;
            color: #563923;
            font-size: 16px;
            line-height: 1;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
        }

        .close-login-btn:hover {
            background: #563923;
            color: #fff;
            border-color: #563923;
        }

        .brand-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 8px;
            color: #987354;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-label span {
            width: 20px;
            height: 1px;
            background: #c9a98a;
        }

        .logo {
            text-align: center;
            margin-bottom: 3px;
        }

        .logo img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }

        .title {
            text-align: center;
            font-size: 26px;
            letter-spacing: -0.8px;
            color: #39271d;
            margin-bottom: 6px;
        }

        .welcome {
            text-align: center;
            font-size: 12px;
            color: #948477;
            margin-bottom: 20px;
        }

        .form-heading {
            font-size: 16px;
            color: #4b3323;
            margin-bottom: 14px;
        }

        .login-form label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #493629;
            margin-bottom: 7px;
        }

        .input-box {
            display: flex;
            align-items: center;
            width: 100%;
            height: 44px;
            padding: 0 13px;
            margin-bottom: 14px;
            border: 1px solid #e3d9cf;
            border-radius: 8px;
            background: #fff;
            transition: 0.25s;
        }

        .input-box:focus-within {
            border-color: #805638;
            box-shadow: 0 0 0 3px rgba(128, 86, 56, 0.12);
        }

        .input-icon {
            color: #a1846a;
            font-size: 15px;
            margin-right: 10px;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #493629;
        }

        .input-box input::placeholder {
            color: #b4a69b;
        }

        .password-box {
            display: flex;
            width: 100%;
            height: 44px;
            margin-bottom: 17px;
            border: 1px solid #e3d9cf;
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
            transition: 0.25s;
        }

        .password-box:focus-within {
            border-color: #805638;
            box-shadow: 0 0 0 3px rgba(128, 86, 56, 0.12);
        }

        .password-icon {
            display: flex;
            align-items: center;
            padding-left: 13px;
            color: #a1846a;
            font-size: 15px;
        }

        .password-box input {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0 10px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
        }

        .password-box input::placeholder {
            color: #b4a69b;
        }

        .show-btn {
            padding: 0 14px;
            border: none;
            background: #f3ece3;
            color: #765237;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .show-btn:hover {
            background: #e9dccc;
        }

        .login-btn {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            background: #563923;
            color: white;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.25s;
        }

        .login-btn:hover {
            background: #38251b;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(56, 37, 27, 0.25);
        }

        .account-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0 12px;
            color: #a99a8e;
            font-size: 11px;
        }

        .account-divider::before,
        .account-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e9dfd5;
        }

        .create-btn {
            display: block;
            width: 100%;
            padding: 11px;
            text-align: center;
            text-decoration: none;
            border: 1px solid #bca58f;
            border-radius: 8px;
            color: #62452f;
            font-size: 12px;
            font-weight: bold;
            transition: 0.25s;
        }

        .create-btn:hover {
            background: #e9dfd3;
            border-color: #62452f;
        }

        .card-footer {
            text-align: center;
            margin-top: 15px;
            color: #a39487;
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        #message {
            text-align: center;
            font-size: 12px;
            margin-top: 11px;
        }

        @media (max-width: 768px) {
            .hero-tagline {
                left: 22px;
                right: 22px;
                bottom: 24px;
            }
        }

        @media (max-width: 600px) {
            .navigation {
                top: 14px;
                right: 0;
                left: 0;
                justify-content: center;
                flex-wrap: wrap;
            }

            .navigation a,
            .nav-login-btn {
                padding: 8px 13px;
                font-size: 11.5px;
            }

            .login-modal-backdrop {
                padding: 76px 16px 24px;
            }

            .login-content {
                padding: 22px 20px;
            }

            .logo img {
                width: 64px;
                height: 64px;
            }

            .title {
                font-size: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="bg-layer" id="bgLayer">
        <img src="img1.jpg" alt="Brew Buddy Cafe Background">
    </div>
    <div class="bg-overlay"></div>

    <div class="beans" id="beansContainer"></div>
    <nav class="navigation" aria-label="Primary Navigation">
        <button type="button" class="nav-login-btn" id="navLoginBtn" aria-expanded="false" aria-controls="loginModal">
            Log In
        </button>
        <a href="Review.html">Reviews</a>
        <a href="About.html">About Us</a>
    </nav>

    <div class="login-modal-backdrop" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <div class="login-content" id="loginCard">
            <button type="button" class="close-login-btn" id="closeLoginBtn" aria-label="Close login">
                &times;
            </button>

            <div class="brand-label">
                <span></span>
                YOUR COFFEE PLACE
                <span></span>
            </div>

            <div class="logo">
                <img src="logo1-removebg-preview.png" alt="Brew Buddy Cafe Logo">
            </div>

            <h2 class="title" id="loginTitle">Brew Buddy Cafe</h2>

            <p class="welcome">
                Welcome back! Log in to your account.
            </p>

            <h3 class="form-heading">Login to your account</h3>

            <form class="login-form" id="loginForm">
                <label for="email">Email Address</label>
                <div class="input-box">
                    <span class="input-icon">✉</span>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <label for="password">Password</label>
                <div class="password-box">
                    <span class="password-icon">♙</span>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                    <button
                        type="button"
                        class="show-btn"
                        onclick="showPassword()"
                    >
                        Show
                    </button>
                </div>

                <button type="submit" class="login-btn">
                    LOG IN
                </button>

                <div class="account-divider">
                    OR
                </div>

                <a href="Create.html" class="create-btn">
                    Create an Account
                </a>

                <p id="message"></p>
            </form>

            <div class="card-footer">
                MADE WITH CARE AT BREW BUDDY CAFE
            </div>
        </div>
    </div>

    <script>
        (function initLoginPopup() {
            var modal = document.getElementById("loginModal");
            var navLoginBtn = document.getElementById("navLoginBtn");
            var closeLoginBtn = document.getElementById("closeLoginBtn");
            var emailInput = document.getElementById("email");

            function openLoginModal() {
                modal.classList.add("is-open");
                document.body.classList.add("modal-open");
                navLoginBtn.classList.add("active");
                navLoginBtn.setAttribute("aria-expanded", "true");
                setTimeout(function() {
                    if (emailInput) emailInput.focus();
                }, 120);
            }

            function closeLoginModal() {
                modal.classList.remove("is-open");
                document.body.classList.remove("modal-open");
                navLoginBtn.classList.remove("active");
                navLoginBtn.setAttribute("aria-expanded", "false");
            }

            navLoginBtn.addEventListener("click", function() {
                if (modal.classList.contains("is-open")) {
                    closeLoginModal();
                } else {
                    openLoginModal();
                }
            });

            closeLoginBtn.addEventListener("click", closeLoginModal);
            modal.addEventListener("click", function(e) {
                if (e.target === modal) {
                    closeLoginModal();
                }
            });

            document.addEventListener("keydown", function(e) {
                if (e.key === "Escape" && modal.classList.contains("is-open")) {
                    closeLoginModal();
                }
            });
        })();

        function showPassword() {
            var password = document.getElementById("password");
            var button = document.querySelector(".show-btn");

            if (password.type === "password") {
                password.type = "text";
                button.innerHTML = "Hide";
            } else {
                password.type = "password";
                button.innerHTML = "Show";
            }
        }

        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            var email = document.getElementById("email").value.trim().toLowerCase();
            var password = document.getElementById("password").value;
            var message = document.getElementById("message");

            var accounts = JSON.parse(localStorage.getItem("accounts")) || [];

            var user = accounts.find(function(account) {
                return account.email.toLowerCase() === email;
            });

            if (!user) {
                message.style.color = "#b3261e";
                message.innerHTML = "Account not found! Please create an account first.";
                return;
            }

            if (user.password !== password) {
                message.style.color = "#b3261e";
                message.innerHTML = "Incorrect password! Please try again.";
                return;
            }

            localStorage.setItem("loggedInUser", JSON.stringify({
                fullname: user.fullname,
                email: user.email
            }));

            alert("Login successful! Welcome to Brew Buddy Cafe.");
            window.location.href = "landing.html";
        });

        (function initMotion() {
            var prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (prefersReduced) return;

            var beansContainer = document.getElementById("beansContainer");
            var bgLayer = document.getElementById("bgLayer");
            var loginCard = document.getElementById("loginCard");
            var modal = document.getElementById("loginModal");

            var beanCount = 12;
            var beans = [];

            for (var i = 0; i < beanCount; i++) {
                var el = document.createElement("span");
                el.className = "bean";
                var size = 12 + Math.random() * 8;
                el.style.width = size + "px";
                el.style.height = (size * 1.5) + "px";
                beansContainer.appendChild(el);

                beans.push({
                    el: el,
                    x: Math.random() * 100,
                    y: Math.random() * 110 - 10,
                    speed: 0.045 + Math.random() * 0.055,
                    swayOffset: Math.random() * Math.PI * 2,
                    swaySpeed: 0.0015 + Math.random() * 0.0015,
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() > 0.5 ? 1 : -1) * (0.3 + Math.random() * 0.6),
                    maxOpacity: 0.22 + Math.random() * 0.22
                });
            }

            var mouseX = 0;
            var mouseY = 0;
            var currentBgX = 0;
            var currentBgY = 0;

            document.addEventListener("mousemove", function(e) {
                mouseX = (e.clientX / window.innerWidth) - 0.5;
                mouseY = (e.clientY / window.innerHeight) - 0.5;

                if (loginCard && modal.classList.contains("is-open") && window.innerWidth > 768) {
                    var tiltX = (-mouseY * 4).toFixed(2);
                    var tiltY = (mouseX * 5).toFixed(2);
                    loginCard.style.transform = "perspective(900px) rotateX(" + tiltX + "deg) rotateY(" + tiltY + "deg) scale(1)";
                }
            });

            document.addEventListener("mouseleave", function() {
                mouseX = 0;
                mouseY = 0;
                if (loginCard && modal.classList.contains("is-open")) {
                    loginCard.style.transform = "perspective(900px) rotateX(0deg) rotateY(0deg) scale(1)";
                }
            });

            var lastTime = performance.now();

            function animate(now) {
                var dt = Math.min(now - lastTime, 50);
                lastTime = now;

                currentBgX += (-mouseX * 18 - currentBgX) * 0.06;
                currentBgY += (-mouseY * 18 - currentBgY) * 0.06;
                if (bgLayer) {
                    bgLayer.style.transform = "translate3d(" + currentBgX.toFixed(2) + "px, " + currentBgY.toFixed(2) + "px, 0)";
                }

                for (var j = 0; j < beans.length; j++) {
                    var b = beans[j];
                    b.y += b.speed * (dt / 16.67);
                    b.rot += b.rotSpeed * (dt / 16.67);

                    if (b.y > 108) {
                        b.y = -8;
                        b.x = Math.random() * 100;
                    }

                    var sway = Math.sin(now * b.swaySpeed + b.swayOffset) * 14;
                    var fade = 1;
                    if (b.y < 10) fade = Math.max(0, b.y / 10);
                    else if (b.y > 90) fade = Math.max(0, (108 - b.y) / 18);

                    var opacity = (b.maxOpacity * fade).toFixed(3);
                    var pxX = (b.x / 100) * window.innerWidth + sway;
                    var pxY = (b.y / 100) * window.innerHeight;

                    b.el.style.opacity = opacity;
                    b.el.style.transform = "translate3d(" + pxX.toFixed(1) + "px, " + pxY.toFixed(1) + "px, 0) rotate(" + b.rot.toFixed(1) + "deg)";
                }

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        })();
    </script>

</body>

</html>
